<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0b0f19',
                        surface: '#131b2e',
                        outline: '#1f293d',
                        neon: '#5eead4',
                        neonHover: '#2dd4bf',
                        primaryBtn: '#0d9488',
                        primaryBtnHover: '#14b8a6'
                    },
                    fontFamily: { sans: ['system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-base text-white pb-28">

    <!-- Top Navigation -->
    <nav class="flex justify-between items-center px-6 md:px-10 py-5 bg-base border-b border-outline sticky top-0 z-50">
        <!-- Single Main Logo -->
        <a href="#" class="text-2xl font-black text-white no-underline tracking-wide">
            Lumina<span class="text-neon">.</span>
        </a>
        
        <!-- Center Links -->
        <div class="hidden md:flex gap-6 items-center">
           
            <a href="/index.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">Shop</a>
            <a href="/categories.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">Categories</a>
            <a href="/deals.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">Deals</a>
            <a href="/about.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">About</a>
            <a href="/orders.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">Orders</a>
        </div>

        <!-- Right Icons -->
        <div class="flex gap-3 items-center ml-5">
            <a href="/account.html" class="flex items-center justify-center w-10 h-10 border border-outline rounded-lg text-gray-400 hover:text-neon hover:border-neon/50 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </a>
            <a href="/cart.html" class="relative flex items-center justify-center w-10 h-10 border border-outline rounded-lg text-gray-400 hover:text-neon hover:border-neon/50 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span id="navCartCount" class="absolute -top-1.5 -right-1.5 bg-neon text-base w-5 h-5 rounded-full text-xs font-extrabold flex items-center justify-center border-2 border-base">0</span>
            </a>
           
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-10 px-5">
        
        <!-- Search Bar & Auto-Suggest Section -->
        <div class="bg-surface border border-outline rounded-2xl p-6 mb-8 flex flex-col md:flex-row gap-4 items-center shadow-lg relative">
            <svg class="text-gray-400 hidden md:block" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            
            <div class="w-full relative">
                <input type="text" id="searchInput" autocomplete="off" placeholder="Search for hardware, peripherals, and more..." class="w-full bg-base border border-outline text-white px-5 py-3 rounded-xl focus:outline-none focus:border-neon transition-colors placeholder-gray-500 text-lg relative z-20">
                
                <!-- Autocomplete Dropdown Menu -->
                <ul id="searchSuggestions" class="absolute left-0 right-0 top-full mt-2 bg-surface border border-outline rounded-xl shadow-2xl max-h-64 overflow-y-auto z-30 hidden">
                    <!-- Dynamic suggestions go here -->
                </ul>
            </div>
        </div>
        
        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic products load here -->
        </div>
    </div>

    <!-- Sticky Bottom Cart Bar -->
    <div id="cartBar" class="fixed bottom-0 left-0 w-full bg-gray-900 border-t border-outline px-8 py-4 hidden justify-between items-center shadow-[0_-5px_20px_rgba(0,0,0,0.5)] z-50">
        <div class="text-lg font-medium text-gray-100">
            Cart Items: <span id="cartCount">0</span> | Total: <span id="cartTotal" class="text-neon font-bold">$0.00</span>
        </div>
        <button class="bg-neon hover:bg-neonHover text-base text-base border-none py-3 px-7 rounded-lg font-bold cursor-pointer transition-colors" onclick="alert('Proceeding to checkout!')">Proceed to Checkout</button>
    </div>

    <script>
        // 1. Map actual images and categories to product types
        const productData = {
            'Mechanical Keyboard': { cat: 'Keyboards & Peripherals', img: 'https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=600&q=80' },
            'Wireless Mouse': { cat: 'Gaming Hardware', img: 'https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?auto=format&fit=crop&w=600&q=80' },
            'Studio Headset': { cat: 'Audio Gear', img: 'https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb?auto=format&fit=crop&w=600&q=80' },
            'Condenser Mic': { cat: 'Streaming', img: 'https://images.unsplash.com/photo-1590602847861-f357a9332bbc?auto=format&fit=crop&w=600&q=80' },
            'Gaming Monitor': { cat: 'Displays', img: 'https://images.unsplash.com/photo-1593640408182-31c70c8268f5?auto=format&fit=crop&w=600&q=80' },
            'Pro Webcam': { cat: 'Streaming', img: 'https://images.unsplash.com/photo-1628126235206-5260b9ea6441?auto=format&fit=crop&w=600&q=80' }
        };

        const adjectives = ['Neon', 'Apex', 'Cyber', 'Quantum', 'Stealth', 'Nova', 'Pulse'];
        const types = Object.keys(productData);

        // Generate 200 Dummy Products
        const allProducts = Array.from({ length: 200 }, (_, i) => {
            const type = types[Math.floor(Math.random() * types.length)];
            const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const mappedInfo = productData[type];
            
            return {
                id: i + 1,
                name: `${adj} ${type} v${(i % 5) + 1}`,
                category: mappedInfo.cat,
                price: (Math.random() * 150 + 20).toFixed(2),
                image: mappedInfo.img,
                description: `High-performance ${type.toLowerCase()} engineered for ultimate responsiveness.`
            };
        });

        // 2. Render Function
        const productsGrid = document.getElementById('productsGrid');

        function renderProducts(productsToDisplay) {
            if (productsToDisplay.length === 0) {
                productsGrid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10 text-xl">No products found matching your search.</div>`;
                return;
            }

            productsGrid.innerHTML = productsToDisplay.map(product => `
                <div class="bg-surface border border-outline rounded-2xl overflow-hidden flex flex-col justify-between shadow-lg hover:-translate-y-1 transition-transform duration-200">
                    <div class="relative w-full h-48">
                        <span class="absolute top-4 left-4 bg-neon/20 text-neon px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-sm border border-neon/30 z-10">${product.category}</span>
                        <img class="w-full h-full object-cover" src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="p-5 flex flex-col gap-1">
                        <span class="text-gray-500 text-xs font-semibold uppercase tracking-wider">ID #${product.id}</span>
                        <h3 class="text-lg font-bold text-white leading-tight">${product.name}</h3>
                        <p class="text-gray-400 text-sm mt-1">${product.description}</p>
                    </div>
                    <div class="flex justify-between items-center p-5 pt-0">
                        <span class="text-xl font-bold text-neon">$${product.price}</span>
                        <button class="add-to-cart-btn bg-primaryBtn hover:bg-primaryBtnHover text-white text-sm py-2 px-4 rounded-lg font-semibold cursor-pointer transition-colors" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        renderProducts(allProducts);

        // 3. Search & Auto-Suggest Logic
        const searchInput = document.getElementById('searchInput');
        const searchSuggestions = document.getElementById('searchSuggestions');

        searchInput.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            // Filter products for the main grid
            const filteredProducts = allProducts.filter(product => 
                product.name.toLowerCase().includes(searchTerm) || 
                product.category.toLowerCase().includes(searchTerm)
            );
            renderProducts(filteredProducts);

            // Handle the dropdown suggestions
            if (searchTerm.length === 0) {
                searchSuggestions.classList.add('hidden');
                return;
            }

            // Get up to 6 unique matching names to suggest
            const suggestions = filteredProducts.slice(0, 6);

            if (suggestions.length > 0) {
                searchSuggestions.innerHTML = suggestions.map(product => `
                    <li class="suggestion-item px-5 py-3 hover:bg-outline cursor-pointer border-b border-outline/50 last:border-none flex justify-between items-center transition-colors" data-name="${product.name}">
                        <div class="flex flex-col">
                            <span class="text-gray-200 font-semibold">${product.name}</span>
                            <span class="text-xs text-gray-500">${product.category}</span>
                        </div>
                        <svg class="text-gray-500 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </li>
                `).join('');
                searchSuggestions.classList.remove('hidden');
            } else {
                searchSuggestions.classList.add('hidden');
            }
        });

        // Click on a suggestion to auto-fill
        searchSuggestions.addEventListener('click', function(e) {
            const li = e.target.closest('li.suggestion-item');
            if (!li) return;
            
            const selectedName = li.getAttribute('data-name');
            searchInput.value = selectedName;
            searchSuggestions.classList.add('hidden');
            
            // Re-render grid to show only the exact match
            const exactMatch = allProducts.filter(product => product.name === selectedName);
            renderProducts(exactMatch);
        });

        // Hide suggestions when clicking anywhere outside
        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !searchSuggestions.contains(e.target)) {
                searchSuggestions.classList.add('hidden');
            }
        });

        // 4. Cart Logic
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        updateCartUI();

        document.addEventListener('click', function(event) {
            const button = event.target.closest('.add-to-cart-btn');
            if (!button) return;

            const id = button.getAttribute('data-id');
            const name = button.getAttribute('data-name');
            const price = parseFloat(button.getAttribute('data-price'));

            cart.push({ id, name, price });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        });

        function updateCartUI() {
            const totalItems = cart.length;
            const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

            const navCount = document.getElementById('navCartCount');
            if (navCount) navCount.textContent = totalItems;

            const cartBar = document.getElementById('cartBar');
            const countSpan = document.getElementById('cartCount');
            const totalSpan = document.getElementById('cartTotal');
            
            if (countSpan) countSpan.textContent = totalItems;
            if (totalSpan) totalSpan.textContent = `$${totalPrice.toFixed(2)}`;

            if (cartBar) {
                if (totalItems > 0) {
                    cartBar.classList.remove('hidden');
                    cartBar.classList.add('flex');
                } else {
                    cartBar.classList.add('hidden');
                    cartBar.classList.remove('flex');
                }
            }
        }
    </script>
</body>
</html>
