<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Lumina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .neon-text {
            text-shadow: 0 0 10px rgba(45, 212, 191, 0.6), 0 0 20px rgba(45, 212, 191, 0.4);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        html:not(.dark) .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-slate-950 text-slate-300 dark:bg-slate-950 dark:text-slate-300 bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden transition-colors duration-300">

    <!-- HEADER -->
    <header class="bg-slate-950/80 dark:bg-slate-950/80 bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-white/10 dark:border-white/10 border-slate-200 shadow-lg transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <h1 class="text-3xl font-black tracking-tighter text-white dark:text-white text-slate-900">
                <a href="index.html">Lumina<span class="text-teal-400 neon-text">.</span></a>
            </h1>
            
            <nav class="hidden md:flex space-x-8 text-sm font-semibold text-slate-400 dark:text-slate-400 text-slate-600">
                <a href="index.html" class="hover:text-teal-400 transition">Shop</a>
                <a href="categories.html" class="hover:text-teal-400 transition">Categories</a>
                <a href="deals.html" class="hover:text-teal-400 transition">Deals</a>
                <a href="about.html" class="hover:text-teal-400 transition">About</a>
            </nav>

            <div class="flex items-center space-x-3">
                <!-- Day / Dark Mode Toggle Button -->
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-800/50 dark:bg-slate-800/50 bg-slate-200 text-teal-400 hover:bg-slate-800 transition-all border border-white/10 dark:border-white/10 border-slate-300" title="Toggle Day/Dark Mode">
                    <svg id="sun-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="moon-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow w-full py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        <div class="mb-8">
            <h2 class="text-3xl md:text-4xl font-black text-white dark:text-white text-slate-900">Checkout</h2>
            <p class="text-slate-400 dark:text-slate-400 text-slate-600 mt-1">Complete your shipping and payment details.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            
            <!-- Checkout Form -->
            <div class="lg:col-span-2 glass-card p-6 sm:p-8 rounded-2xl space-y-6">
                <h3 class="text-xl font-bold text-white dark:text-white text-slate-900 border-b border-white/10 pb-4">Shipping Information</h3>
                
                <form id="checkout-form" class="space-y-4" onsubmit="event.preventDefault(); alert('Order placed successfully!'); localStorage.removeItem('lumina_cart'); window.location.href='index.html';">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">First Name</label>
                            <input type="text" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Last Name</label>
                            <input type="text" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Email Address</label>
                        <input type="email" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Shipping Address</label>
                        <input type="text" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition" placeholder="Street address, apartment, suite">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">City</label>
                            <input type="text" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Postal Code</label>
                            <input type="text" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Country</label>
                            <input type="text" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-teal-400 transition">
                        </div>
                    </div>

                    <h3 class="text-xl font-bold text-white dark:text-white text-slate-900 border-b border-white/10 pt-6 pb-4">Payment Method</h3>
                    
                    <div class="space-y-3">
                        <label class="flex items-center gap-3 p-4 rounded-xl bg-white/5 border border-white/10 cursor-pointer hover:border-teal-400/50 transition">
                            <input type="radio" name="payment" checked class="text-teal-500 focus:ring-teal-400">
                            <span class="font-semibold text-white">Credit / Debit Card</span>
                        </label>
                        <label class="flex items-center gap-3 p-4 rounded-xl bg-white/5 border border-white/10 cursor-pointer hover:border-teal-400/50 transition">
                            <input type="radio" name="payment" class="text-teal-500 focus:ring-teal-400">
                            <span class="font-semibold text-white">Cash on Delivery</span>
                        </label>
                    </div>

                    <button type="submit" class="w-full mt-6 bg-teal-500 text-slate-950 font-bold text-lg py-4 rounded-xl hover:bg-teal-400 transition-colors shadow-[0_0_15px_rgba(45,212,191,0.4)]">
                        Place Order
                    </button>
                </form>
            </div>

            <!-- Order Summary Sidebar -->
            <div class="glass-card p-6 sm:p-8 rounded-2xl space-y-6 sticky top-28">
                <h3 class="text-xl font-black text-white dark:text-white text-slate-900 border-b border-white/10 pb-4">Order Summary</h3>
                
                <div id="checkout-items-preview" class="space-y-3 max-h-60 overflow-y-auto">
                    <!-- Loaded dynamically via cart.js -->
                </div>

                <div class="space-y-3 text-sm border-t border-white/10 pt-4">
                    <div class="flex justify-between text-slate-400">
                        <span>Subtotal</span>
                        <span id="summary-subtotal" class="font-bold text-white">$0.00</span>
                    </div>
                    <div class="flex justify-between text-slate-400">
                        <span>Estimated Shipping</span>
                        <span class="font-bold text-teal-400">Free</span>
                    </div>
                    <div class="flex justify-between text-slate-400">
                        <span>Tax (Estimated)</span>
                        <span id="summary-tax" class="font-bold text-white">$0.00</span>
                    </div>
                </div>

                <div class="border-t border-white/10 pt-4 flex justify-between items-center">
                    <span class="font-bold text-white text-base">Total</span>
                    <span id="summary-total" class="font-black text-2xl text-teal-400">$0.00</span>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-950 dark:bg-slate-950 bg-slate-100 border-t border-slate-800 py-6 text-center text-slate-500 text-sm mt-auto transition-colors duration-300">
        <p>&copy; 2026 Lumina. All rights reserved.</p>
    </footer>

    <!-- THEME TOGGLE SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const htmlRoot = document.getElementById('html-root');

            const savedTheme = localStorage.getItem('lumina_theme') || 'dark';
            if (savedTheme === 'light') {
                htmlRoot.classList.remove('dark');
            } else {
                htmlRoot.classList.add('dark');
            }

            themeToggleBtn.addEventListener('click', () => {
                if (htmlRoot.classList.contains('dark')) {
                    htmlRoot.classList.remove('dark');
                    localStorage.setItem('lumina_theme', 'light');
                } else {
                    htmlRoot.classList.add('dark');
                    localStorage.setItem('lumina_theme', 'dark');
                }
            });
        });
    </script>
    
    <!-- SHARED CART LOGIC -->
    <script src="cart.js"></script>
</body>
</html>
