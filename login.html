<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Glass Portal - Lumina</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #050505;
            overflow: hidden;
            cursor: crosshair; 
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }
        .glow-cyan {
            width: 300px;
            height: 300px;
            background: rgba(0, 255, 255, 0.15);
            top: 20%;
            left: 20%;
        }
        .glow-magenta {
            width: 250px;
            height: 250px;
            background: rgba(255, 0, 255, 0.15);
            bottom: 20%;
            right: 20%;
        }

        .login-box {
            position: relative;
            width: 380px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5),
                        0 0 15px rgba(0, 255, 255, 0.2);
            z-index: 10;
        }

        h2 {
            margin: 0 0 30px;
            padding: 0;
            color: #fff;
            text-align: center;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #03e9f4;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 30px;
            border: none;
            border-bottom: 2px solid #fff;
            outline: none;
            background: transparent;
            transition: 0.5s;
        }

        .input-group label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px 0;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            transition: 0.5s;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -20px;
            left: 0;
            color: #03e9f4;
            font-size: 12px;
            text-shadow: 0 0 5px #03e9f4;
        }

        .input-group input:focus,
        .input-group input:valid {
            border-bottom: 2px solid #03e9f4;
            box-shadow: 0 1px 0 0 #03e9f4;
        }

        /* Button Container */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            position: relative;
            display: inline-block;
            padding: 10px 10px;
            font-size: 15px;
            text-transform: uppercase;
            overflow: hidden;
            transition: 0.5s;
            letter-spacing: 2px;
            background: transparent;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }

        /* Enter Button (Cyan) */
        .btn-enter {
            color: #03e9f4;
            border: 1px solid #03e9f4;
        }
        .btn-enter:hover {
            background: #03e9f4;
            color: #050505;
            box-shadow: 0 0 5px #03e9f4, 0 0 25px #03e9f4, 0 0 50px #03e9f4;
        }

        /* Sign Up Button (Magenta) */
        .btn-signup {
            color: #ff00ff;
            border: 1px solid #ff00ff;
        }
        .btn-signup:hover {
            background: #ff00ff;
            color: #050505;
            box-shadow: 0 0 5px #ff00ff, 0 0 25px #ff00ff, 0 0 50px #ff00ff;
        }

        .links {
            margin-top: 25px;
            text-align: center;
        }

        .links a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 12px;
            transition: 0.3s;
            cursor: pointer;
        }

        .links a:hover {
            color: #03e9f4;
            text-shadow: 0 0 8px #03e9f4;
        }
    </style>
</head>
<body>

    <div class="glow-sphere glow-cyan"></div>
    <div class="glow-sphere glow-magenta"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="login-box">
        <h2>Portal</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" required autocomplete="off">
                <label>Username</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required>
                <label>Password</label>
            </div>
            
            <div class="button-group">
                <button type="button" id="enterBtn" class="btn-enter">Enter</button>
                <button type="button" id="signupBtn" class="btn-signup">Sign Up</button>
            </div>

            <div class="links">
                <a href="index.html">Return to Store</a>
            </div>
        </form>
    </div>

    <script>
        /* =========================================
           1. WEB AUDIO API - SOUND SYNTHESIS
           ========================================= */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'square'; 
            
            if (type === 'enter') {
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.15);
            } else {
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.15);
            }

            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        }

        /* =========================================
           2. INTERACTION LOGIC
           ========================================= */
        document.addEventListener('DOMContentLoaded', () => {
            const enterBtn = document.getElementById('enterBtn');
            const signupBtn = document.getElementById('signupBtn');
            
            enterBtn.addEventListener('click', (e) => {
                e.preventDefault();
                playSound('enter');
                createExplosion();
                
                enterBtn.textContent = 'ACCESS...';
                setTimeout(() => {
                    enterBtn.textContent = 'Enter';
                    window.location.href = 'index.html'; // Redirects to store
                }, 1000);
            });

            signupBtn.addEventListener('click', (e) => {
                e.preventDefault();
                playSound('signup');
                createExplosion();
                
                signupBtn.textContent = 'REG...';
                setTimeout(() => {
                    signupBtn.textContent = 'Sign Up';
                    alert('Sign up portal initializing...');
                }, 1000);
            });
        });

        /* =========================================
           3. BACKGROUND PARTICLE SYSTEM
           ========================================= */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const colors = ['#03e9f4', '#ff00ff', '#ffffff', '#2dd4bf'];

        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                const speedMult = isExplosion ? 5 : 1;
                this.speedX = (Math.random() * 3 - 1.5) * speedMult;
                this.speedY = (Math.random() * 3 - 1.5) * speedMult;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = isExplosion ? 100 : Infinity; 
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.life === Infinity) {
                    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                } else {
                    this.life--;
                    this.size *= 0.95; 
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function createExplosion() {
            for (let i = 0; i < 50; i++) {
                particlesArray.push(new Particle(canvas.width / 2, canvas.height / 2, true));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                if (particlesArray[i].life <= 0 || particlesArray[i].size <= 0.2) {
                    particlesArray.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });
    </script>
</body>
</html>
