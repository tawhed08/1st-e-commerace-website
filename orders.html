<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Lumina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .neon-text { text-shadow: 0 0 10px rgba(45, 212, 191, 0.6), 0 0 20px rgba(45, 212, 191, 0.4); }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        html:not(.dark) .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-slate-950 text-slate-300 dark:bg-slate-950 dark:text-slate-300 bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden transition-colors duration-300">

    <!-- HEADER -->
    <header class="bg-slate-950/80 dark:bg-slate-950/80 bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-white/10 dark:border-white/10 border-slate-200 shadow-lg transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <h1 class="text-3xl font-black tracking-tighter text-white dark:text-white text-slate-900">
                <a href="index.html">Lumina<span class="text-teal-400 neon-text">.</span></a>
            </h1>
            
            <nav class="hidden md:flex space-x-8 text-sm font-semibold text-slate-400 dark:text-slate-400 text-slate-600">
                <a href="index.html" class="hover:text-teal-400 transition">Shop</a>
                <a href="categories.html" class="hover:text-teal-400 transition">Categories</a>
                <a href="deals.html" class="hover:text-teal-400 transition">Deals</a>
                <a href="orders.html" class="text-teal-400 font-bold">Orders</a>
                <a href="about.html" class="hover:text-teal-400 transition">About</a>
                <a href="account.html" class="hover:text-teal-400 transition">Account</a>

            </nav>

            <div class="flex items-center space-x-3">
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-800/50 dark:bg-slate-800/50 bg-slate-200 text-teal-400 hover:bg-slate-800 transition-all border border-white/10 dark:border-white/10 border-slate-300">
                    <svg id="sun-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="moon-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow w-full py-12 px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto">
        <div class="mb-8">
            <h2 class="text-3xl md:text-4xl font-black text-white dark:text-white text-slate-900">Purchase History</h2>
            <p class="text-slate-400 dark:text-slate-400 text-slate-600 mt-1">Review the products you have previously bought.</p>
        </div>

        <div id="orders-container" class="space-y-6">
            <!-- Populated dynamically via script below -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-950 dark:bg-slate-950 bg-slate-100 border-t border-slate-800 py-6 text-center text-slate-500 text-sm mt-auto transition-colors duration-300">
        <p>&copy; 2026 Lumina. All rights reserved BP IT TECH.</p>
    </footer>

    <!-- SCRIPT TO RENDER ORDERS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Toggle Logic
            const themeToggleBtn = document.getElementById('theme-toggle');
            const htmlRoot = document.getElementById('html-root');
            const savedTheme = localStorage.getItem('lumina_theme') || 'dark';
            if (savedTheme === 'light') { htmlRoot.classList.remove('dark'); } else { htmlRoot.classList.add('dark'); }
            themeToggleBtn.addEventListener('click', () => {
                if (htmlRoot.classList.contains('dark')) {
                    htmlRoot.classList.remove('dark');
                    localStorage.setItem('lumina_theme', 'light');
                } else {
                    htmlRoot.classList.add('dark');
                    localStorage.setItem('lumina_theme', 'dark');
                }
            });

            // Load Orders from localStorage
            const ordersContainer = document.getElementById('orders-container');
            const pastOrders = JSON.parse(localStorage.getItem('lumina_orders')) || [];

            if (pastOrders.length === 0) {
                ordersContainer.innerHTML = `
                    <div class="glass-card p-12 rounded-2xl text-center text-slate-500">
                        <p class="text-lg">You haven't purchased any products yet.</p>
                        <a href="index.html" class="inline-block mt-4 text-teal-400 font-semibold underline">Start shopping now</a>
                    </div>`;
                return;
            }

            let ordersHTML = '';
            pastOrders.forEach((order, orderIndex) => {
                let itemsHTML = '';
                let orderTotal = 0;

                order.items.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    orderTotal += itemTotal;
                    itemsHTML += `
                        <div class="flex items-center justify-between py-3 border-b border-white/5 last:border-none">
                            <div class="flex items-center gap-4">
                                <img src="${item.image}" alt="${item.name}" class="w-14 h-14 object-cover rounded-xl bg-slate-800">
                                <div>
                                    <h4 class="font-bold text-white dark:text-white text-slate-900">${item.name}</h4>
                                    <p class="text-xs text-slate-400">Qty: ${item.quantity} × $${item.price.toFixed(2)}</p>
                                </div>
                            </div>
                            <span class="font-black text-teal-400">$${itemTotal.toFixed(2)}</span>
                        </div>
                    `;
                });

                ordersHTML += `
                    <div class="glass-card p-6 rounded-2xl space-y-4 border border-white/10">
                        <div class="flex flex-wrap justify-between items-center pb-4 border-b border-white/10 gap-2">
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Order ID: #LUM-${202600 + orderIndex}</span>
                                <p class="text-sm text-slate-400">Placed on: ${order.date}</p>
                            </div>
                            <span class="bg-teal-500/10 border border-teal-500/30 text-teal-400 px-3 py-1 rounded-full text-xs font-bold">Completed</span>
                        </div>
                        <div class="divide-y divide-white/5">
                            ${itemsHTML}
                        </div>
                        <div class="flex justify-between items-center pt-3 border-t border-white/10 font-black text-white dark:text-white text-slate-900">
                            <span>Total Paid</span>
                            <span class="text-xl text-teal-400">$${(orderTotal * 1.05).toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });

            ordersContainer.innerHTML = ordersHTML;
        });
    </script>
</body>
</html>
