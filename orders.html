<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Checkout & Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0b0f19',
                        surface: '#131b2e',
                        outline: '#1f293d',
                        neon: '#5eead4',
                        neonHover: '#2dd4bf',
                        primaryBtn: '#0d9488',
                        primaryBtnHover: '#14b8a6'
                    },
                    fontFamily: { sans: ['system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-base text-white flex flex-col min-h-screen">

    <!-- Top Navigation -->
    <nav class="flex justify-between items-center px-6 md:px-10 py-5 bg-base border-b border-outline sticky top-0 z-50">
        <a href="#" class="text-2xl font-black text-white no-underline tracking-wide">
            Lumina<span class="text-neon">.</span>
        </a>
        
        <div class="hidden md:flex gap-6 items-center">
            <a href="/index.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">Shop</a>
            <a href="/categories.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">Categories</a>
            <a href="/deals.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">Deals</a>
            <a href="/about.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">About</a>
            <a href="/orders.html" class="text-gray-400 text-sm font-medium hover:text-neon transition-colors">Orders</a>
        </div>

        <div class="flex gap-3 items-center ml-5">
            <a href="/account.html" class="flex items-center justify-center w-10 h-10 border border-outline rounded-lg text-gray-400 hover:text-neon hover:border-neon/50 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </a>
            <a href="/cart.html" class="relative flex items-center justify-center w-10 h-10 border border-outline rounded-lg text-gray-400 hover:text-neon hover:border-neon/50 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span id="navCartCount" class="absolute -top-1.5 -right-1.5 bg-neon text-base w-5 h-5 rounded-full text-xs font-extrabold flex items-center justify-center border-2 border-base">0</span>
            </a>
            <!-- <a href="#settings" class="flex items-center justify-center w-10 h-10 border border-outline rounded-lg text-gray-400 hover:text-neon hover:border-neon/50 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </a> -->
        </div>
    </nav>

    <!-- Main Checkout Content -->
    <main class="max-w-6xl mx-auto mt-10 px-5 flex-grow mb-20">
        <h1 class="text-3xl font-black text-white mb-8 tracking-tight">Checkout & Place Order</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left 2 Columns: Shipping & Payment Form -->
            <div class="lg:col-span-2 space-y-6">
                <form id="orderForm" onsubmit="handleOrderSubmit(event)" class="space-y-6">
                    
                    <!-- Shipping Info Card -->
                    <div class="bg-surface border border-outline rounded-2xl p-6 shadow-lg">
                        <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <span class="w-7 h-7 bg-neon/10 text-neon border border-neon/20 rounded-lg flex items-center justify-center text-sm font-bold">1</span>
                            Shipping Information
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm text-gray-400 mb-1 font-medium">Full Name</label>
                                <input type="text" required placeholder="Alex Mercer" class="w-full bg-base border border-outline rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1 font-medium">Email Address</label>
                                <input type="email" required placeholder="alex@example.com" class="w-full bg-base border border-outline rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon transition-colors">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm text-gray-400 mb-1 font-medium">Street Address</label>
                                <input type="text" required placeholder="123 Cyber Way, Suite 404" class="w-full bg-base border border-outline rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1 font-medium">City</label>
                                <input type="text" required placeholder="Neo City" class="w-full bg-base border border-outline rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon transition-colors">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1 font-medium">Postal Code</label>
                                <input type="text" required placeholder="90210" class="w-full bg-base border border-outline rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon transition-colors">
                            </div>
                        </div>
                    </div>

                    <!-- Payment Info Card -->
                    <div class="bg-surface border border-outline rounded-2xl p-6 shadow-lg">
                        <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            <span class="w-7 h-7 bg-neon/10 text-neon border border-neon/20 rounded-lg flex items-center justify-center text-sm font-bold">2</span>
                            Payment Method
                        </h2>
                        <div class="space-y-3">
                            <label class="flex items-center gap-3 p-4 bg-base border border-neon rounded-xl cursor-pointer">
                                <input type="radio" name="payment" checked class="accent-neon">
                                <span class="font-medium text-white">Credit / Debit Card</span>
                            </label>
                            <label class="flex items-center gap-3 p-4 bg-base border border-outline rounded-xl cursor-pointer hover:border-gray-600 transition-colors">
                                <input type="radio" name="payment" class="accent-neon">
                                <span class="font-medium text-white">PayPal</span>
                            </label>
                        </div>
                        <div class="mt-4 space-y-4">
                            <div>
                                <label class="block text-sm text-gray-400 mb-1 font-medium">Card Number</label>
                                <input type="text" placeholder="4000 1234 5678 9010" class="w-full bg-base border border-outline rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon transition-colors">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm text-gray-400 mb-1 font-medium">Expiry Date</label>
                                    <input type="text" placeholder="MM/YY" class="w-full bg-base border border-outline rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon transition-colors">
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-400 mb-1 font-medium">CVV</label>
                                    <input type="password" placeholder="123" maxlength="4" class="w-full bg-base border border-outline rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon transition-colors">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-primaryBtn hover:bg-primaryBtnHover text-white py-4 rounded-xl font-bold text-lg transition-colors cursor-pointer shadow-lg">
                        Place Order
                    </button>
                </form>
            </div>

            <!-- Right Column: Order Summary / Cart Items -->
            <div>
                <div class="bg-surface border border-outline rounded-2xl p-6 shadow-lg sticky top-24">
                    <h2 class="text-xl font-bold text-white mb-4">Order Summary</h2>
                    
                    <!-- Dynamic Cart Items List -->
                    <div id="checkoutItemsList" class="space-y-3 max-h-64 overflow-y-auto pr-1 mb-6 divide-y divide-outline/50">
                        <!-- Populated by JavaScript -->
                    </div>

                    <div class="space-y-2 border-t border-outline pt-4 text-sm">
                        <div class="flex justify-between text-gray-400">
                            <span>Subtotal</span>
                            <span id="summarySubtotal" class="text-white">$0.00</span>
                        </div>
                        <div class="flex justify-between text-gray-400">
                            <span>Shipping</span>
                            <span class="text-neon font-semibold">FREE</span>
                        </div>
                        <div class="flex justify-between text-lg font-bold text-white pt-2 border-t border-outline">
                            <span>Total</span>
                            <span id="summaryTotal" class="text-neon">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            updateCheckoutUI();

            function updateCheckoutUI() {
                const navCount = document.getElementById('navCartCount');
                if (navCount) navCount.textContent = cart.length;

                const itemsList = document.getElementById('checkoutItemsList');
                const subtotalSpan = document.getElementById('summarySubtotal');
                const totalSpan = document.getElementById('summaryTotal');

                if (cart.length === 0) {
                    itemsList.innerHTML = `<p class="text-gray-500 text-sm py-4 text-center">Your cart is empty.</p>`;
                    subtotalSpan.textContent = '$0.00';
                    totalSpan.textContent = '$0.00';
                    return;
                }

                let totalPrice = 0;
                itemsList.innerHTML = cart.map((item, index) => {
                    totalPrice += item.price;
                    return `
                        <div class="flex justify-between items-center pt-3 first:pt-0">
                            <div>
                                <p class="text-sm font-semibold text-white">${item.name}</p>
                                <span class="text-xs text-gray-500">ID: #${item.id}</span>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-bold text-neon">$${item.price.toFixed(2)}</p>
                                <button onclick="removeItem(${index})" class="text-xs text-red-400 hover:underline">Remove</button>
                            </div>
                        </div>
                    `;
                }).join('');

                subtotalSpan.textContent = `$${totalPrice.toFixed(2)}`;
                totalSpan.textContent = `$${totalPrice.toFixed(2)}`;
            }

            window.removeItem = function(index) {
                cart.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCheckoutUI();
            };
        });

        function handleOrderSubmit(event) {
            event.preventDefault();
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                alert('Your cart is empty! Please add items before placing an order.');
                return;
            }
            
            alert('🎉 Order placed successfully! Thank you for shopping with Lumina.');
            localStorage.removeItem('cart');
            window.location.reload();
        }
    </script>
</body>
</html>
